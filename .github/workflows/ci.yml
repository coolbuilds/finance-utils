name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test + Coverage
        run: npm run coverage

      - name: Generate Coverage Badge
        run: npm run coverage:badge

      - name: Build
        run: npm run build

      - name: Configure Git
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${VERSION}"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Tag ${RELEASE_TAG} already exists. Skipping npm publish and GitHub release."
            echo "SHOULD_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SHOULD_RELEASE=true" >> "$GITHUB_ENV"

          if [ -f CHANGELOG.md ]; then
            awk -v tag="## ${RELEASE_TAG}" '
              $0 == tag || index($0, tag " - ") == 1 { found = 1 }
              found && /^## v/ && $0 != tag && index($0, tag " - ") != 1 { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md" || true
          fi

          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$PREVIOUS_TAG" ]; then
              RANGE="${PREVIOUS_TAG}..HEAD"
            else
              RANGE="HEAD"
            fi

            COMMITS=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges --invert-grep --grep="^chore(release):" || true)
            if [ -z "$COMMITS" ]; then
              COMMITS="- Maintenance release."
            fi

            {
              echo "## ${RELEASE_TAG} - $(date -u +%Y-%m-%d)"
              echo
              echo "$COMMITS"
              echo
            } > "$RUNNER_TEMP/release-notes.md"
          fi

          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Verify npm token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SHOULD_RELEASE == 'true'
        run: test -n "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SHOULD_RELEASE == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SHOULD_RELEASE == 'true'
        run: |
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SHOULD_RELEASE == 'true'
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_FILE"
        env:
          GH_TOKEN: ${{ github.token }}
